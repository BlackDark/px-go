min_version = "2024.1.0"

[tools]
    # Go toolchain
    go = "1.27.4"
    golangci-lint = "2.15.0"
    "go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"

[tasks.check]
description = "Format, vet, lint, build, test, vulnerability scan"
run = [
    'test -z "$(gofmt -l .)"',
    "go vet ./...",
    "golangci-lint run ./...",
    "go build ./...",
    "go test -race ./...",
    "govulncheck ./...",
]

[settings]
    experimental = true
    jobs = 4
