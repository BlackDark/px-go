version: 2
project_name: px-go

before:
  hooks:
    - go test ./...

builds:
  - id: px
    main: ./cmd/px
    binary: px-go
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/BlackDark/px-go/internal/version.Version={{ .Version }} -X github.com/BlackDark/px-go/internal/version.Commit={{ .Commit }} -X github.com/BlackDark/px-go/internal/version.Date={{ .Date }}

  - id: px-windows-console
    main: ./cmd/px
    binary: px-go
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/BlackDark/px-go/internal/version.Version={{ .Version }} -X github.com/BlackDark/px-go/internal/version.Commit={{ .Commit }} -X github.com/BlackDark/px-go/internal/version.Date={{ .Date }}

  - id: px-windows-headless
    main: ./cmd/px
    binary: pxw-go
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -H=windowsgui -X github.com/BlackDark/px-go/internal/version.Version={{ .Version }} -X github.com/BlackDark/px-go/internal/version.Commit={{ .Commit }} -X github.com/BlackDark/px-go/internal/version.Date={{ .Date }}

archives:
  - id: unix
    ids: [px]
    formats: [tar.gz]
  - id: windows
    ids: [px-windows-console, px-windows-headless]
    formats: [zip]

checksum:
  name_template: checksums.txt

release:
  draft: false
  prerelease: auto

dockers_v2:
  - ids: [px]
    dockerfile: docker/Dockerfile.goreleaser
    images:
      - ghcr.io/blackdark/{{ .ProjectName }}
    tags:
      - "{{ .Version }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
