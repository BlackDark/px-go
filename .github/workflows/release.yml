# Attach release binaries and the GHCR image to a tag release-please already created.
# workflow_call input `tag`: checks and the Goreleaser checkout both use that ref.
# Do not create the GitHub release again.
# Manual run takes the same tag input.
name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: Tag to build, including the leading v
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build, including the leading v
        required: true
        type: string

permissions: {}

# Fixed prefix: github.workflow is the caller name, so Release and Release Please would not share a group.
concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository] actionlint rejects `$/`
    with:
      ref: ${{ inputs.tag }}
    permissions:
      contents: read

  goreleaser:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # upload assets to the existing GitHub release
      packages: write # push ghcr.io/blackdark/px-go
    steps:
      # keep-existing only preserves notes; it still creates a release when the tag has none.
      - name: Require the existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ inputs.tag }}
