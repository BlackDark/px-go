[proxy]

; NTLM server(s) to connect through. IP:port, hostname:port
;   Multiple proxies can be specified comma separated. Px will iterate through
;   and use the one that works
server =

; PAC file to use to connect
;   Use in place of --server. Supports:
;     - HTTP(S) URL:  http://host/proxy.pac
;     - Local path:   /etc/px-go/proxy.pac
;     - file URL:     file:///etc/px-go/proxy.pac
;     - Relative:     proxy.pac  (resolved next to px.ini, or next to binary without --config)
pac =

; PAC file encoding
;   Specify in case default 'utf-8' encoding does not work
; pac_encoding =

; Network interface(s) to listen on. Comma separated, default: 127.0.0.1
;   --gateway and --hostonly override this to bind to all interfaces
listen = 127.0.0.1

; Port to run this proxy on - default: 3128
port = 3128

; Allow remote machines to use proxy. 0 or 1, default: 0
;   Overrides --listen and binds to all interfaces
gateway = 0

; Allow only local interfaces to use proxy. 0 or 1, default: 0
;   Px allows all IP addresses assigned to local interfaces to use the service.
;   This allows local apps as well as VM or container apps to use Px when in a
;   NAT config. Overrides --listen and overrides the default --allow rules
hostonly = 0

; Allow connection from specific subnets. Comma separated, default: *.*.*.*
;   127.0.0.1 - specific ip
;   192.168.0.* - wildcards
;   192.168.0.1-192.168.0.255 - ranges
;   192.168.0.1/24 - CIDR
allow = *.*.*.*

; Direct connect to specific subnets or domains like a regular proxy. Comma separated
;   Skip the NTLM proxy for connections to these hosts
noproxy =

; Override or send User-Agent header on client's behalf
useragent =

; Authentication to use when SSPI is unavailable. Format is domain\username
username =

; Force instead of discovering upstream proxy type
auth =

; Enable Kerberos ticket management. 0 or 1, default: 0
kerberos = 0

[client]

; Client authentication username. Format is domain\username
client_username =

; Enable authentication for client connections. Comma separated, default: NONE
client_auth = NONE

; Disable SSPI for client authentication on Windows. default: 0
client_nosspi = 0

[settings]

; Number of parallel workers (processes). Ignored in Go (goroutines are lightweight).
; Kept for compatibility with Python px config files. Default: 1
workers = 1

; Max concurrent upstream connection setups (dial + auth handshake).
; CONNECT tunnels release the slot after setup, so active tunnels do NOT
; consume a thread slot. Safe to set high for AI agent workloads.
; Valid integer, default: 128
threads = 128

; Idle timeout in seconds for CONNECT tunnel sessions.
; Tunnel is closed after this many seconds of zero traffic in both directions.
; For AI agents (Copilot, Cursor) that keep long-lived connections, use 300+.
; Valid integer, default: 300
idle = 300

; Timeout in seconds for upstream connection + auth before giving up.
; Valid float, default: 20
socktimeout = 20.0

; Time interval in seconds before refreshing proxy info (PAC reload).
; Valid int, default: 60
proxyreload = 60

; Run in foreground. 0 or 1, default: 0
foreground = 0

; Logging output. 0=none, 1=binary dir, 2=cwd, 3=unique, 4=stdout
; log_file overrides the path for modes 1-3 (recommended for systemd services)
; log_file = /var/log/px-go/px-go.log
log = 0
